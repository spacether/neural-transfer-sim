[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-transfer-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "Brian2>=2.6",
    "optuna>=3.4",
]

[tool.setuptools.packages.find]
include = ["neural_transfer*"]
